      - uses: actions/checkout@v4
      - name: Install cross-compiler      - name: 安装交叉编译器      - 名称: 安装交叉编译器
        run: sudo apt-get install -y gcc-aarch64-linux-gnu cmake
      - name: Build wxshadow      - 名称: 构构建 wxshadow      - 名称: 构建 wxshadow      - 名称: 构建 wxshadow
        run: |        运行: |
          cd kpms/wxshadow && mkdir -p build && cd build
          cmake -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc ..
          make wxshadow.kpm          构建 wxshadow.kpm
      - name: Build hide-so      - 名称: 构构建 hide-so      - 名称: 构构建 hide-so      - 名称: 构建 hide-so      - 名称: 构建 hide-so      - 名称: uild hide-so      - 名称: 构建 hide-so      - 名称: 构建 hide-so      - 名称: 构建 hide-so      - 名称: 建 hide-so      - 名称: 构建 hide-so
        run: |        运行: |
          cd kpms/hide-so && mkdir -p build && cd build
          cmake -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc ..
          make hide-so.kpm          构建 hide-so.kpm
